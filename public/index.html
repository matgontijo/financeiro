<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro Pessoal</title>
  <meta name="theme-color" content="#070912">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="aurora">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" id="brandMark"></span>
        <span class="brand-name">Financeiro<strong>Pessoal</strong></span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard"><span class="ico"></span><span class="lbl">Visão geral</span></button>
        <button class="nav-item" data-view="transactions"><span class="ico"></span><span class="lbl">Lançamentos</span></button>
        <button class="nav-item" data-view="reconcile"><span class="ico"></span><span class="lbl">Conciliação</span></button>
        <button class="nav-item" data-view="calendar"><span class="ico"></span><span class="lbl">Calendário</span></button>
        <button class="nav-item" data-view="accounts"><span class="ico"></span><span class="lbl">Contas</span></button>
        <button class="nav-item" data-view="categories"><span class="ico"></span><span class="lbl">Categorias</span></button>
        <button class="nav-item" data-view="budgets"><span class="ico"></span><span class="lbl">Orçamento</span></button>
        <button class="nav-item" data-view="recurring"><span class="ico"></span><span class="lbl">Recorrências</span></button>
        <button class="nav-item" data-view="goals"><span class="ico"></span><span class="lbl">Metas</span></button>
        <button class="nav-item" data-view="reports"><span class="ico"></span><span class="lbl">Relatórios</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="accent-row" id="accentRow" title="Cor do aplicativo"></div>
        <div class="footer-actions">
          <button class="btn-ghost" id="themeToggle" title="Alternar tema"></button>
          <button class="btn-ghost" id="phoneBtn" title="Acessar pelo celular"></button>
          <button class="btn-ghost" id="pinBtn" title="Proteger com PIN"></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Visão geral</h1>
        <div class="topbar-right">
          <button class="kbd-hint" id="paletteHint" title="Paleta de comandos"><span id="paletteHintIco"></span> Buscar <kbd>Ctrl</kbd><kbd>K</kbd></button>
          <div class="month-nav" id="monthNav">
            <button id="prevMonth" class="btn-icon" title="Mês anterior"></button>
            <span id="monthLabel"></span>
            <button id="nextMonth" class="btn-icon" title="Próximo mês"></button>
            <button id="todayBtn" class="btn-ghost small" title="Voltar ao mês atual">hoje</button>
          </div>
        </div>
      </header>
      <div id="content" class="content"></div>
      <button class="fab" id="fab" title="Novo lançamento (tecla N)"></button>
    </main>
  </div>

  <nav class="bottomnav" id="bottomNav">
    <button data-view="dashboard" class="active"><span class="bico"></span>Início</button>
    <button data-view="transactions"><span class="bico"></span>Lançar</button>
    <button data-view="reconcile"><span class="bico"></span>Conciliar</button>
    <button data-view="calendar"><span class="bico"></span>Mês</button>
    <button id="moreBtn"><span class="bico"></span>Mais</button>
  </nav>

  <div id="modalRoot"></div>
  <div id="paletteRoot"></div>
  <div id="toastRoot"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
